# Render Blueprint: one Docker web service plus a managed PostgreSQL database.
services:
  - type: web
    name: sunshift
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sunshift-db
          property: connectionString
      # A random key for dispatch, farmer commands and registry writes (shown in the dashboard).
      - key: SUNSHIFT_API_KEY
        generateValue: true
      # Text farmers the day's plan at 05:30 India time. A service that sleeps when idle
      # needs the daily-dispatch GitHub workflow instead (see backend/app/scheduler.py).
      - key: DISPATCH_TIMES
        value: "05:30"
      # Where operator alerts go, e.g. https://ntfy.sh/<an unguessable topic>. Render asks
      # for it when the Blueprint is created; leave it empty to turn alerts off.
      - key: ALERT_WEBHOOK_URL
        sync: false

databases:
  - name: sunshift-db
    databaseName: sunshift
    user: sunshift

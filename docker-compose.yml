# Local production-like stack: SunShift + PostgreSQL.
#   docker compose up --build    then open http://localhost:8000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sunshift
      POSTGRES_USER: sunshift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sunshift-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunshift -d sunshift"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://sunshift:${POSTGRES_PASSWORD:-sunshift-local}@db:5432/sunshift
      LOG_LEVEL: INFO
      # Set to enable registry writes (farms, pumps, feeder capacity) through the API
      SUNSHIFT_API_KEY: ${SUNSHIFT_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  pgdata:
